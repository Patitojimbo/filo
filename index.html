        let currentQuestion;

        let answered = false;

        // Elementos del DOM
        const questionElement = document.getElementById('question');
        const optionsElement = document.getElementById('options');
        const scoreElement = document.getElementById('score');
        const nextButton = document.getElementById('next-btn');
        const feedbackElement = document.getElementById('feedback');
        const topicElement = document.getElementById('topic');

        // Función para obtener una pregunta aleatoria
        function getRandomQuestion() {
            // Seleccionar un tema aleatorio
            const topics = Object.keys(questionDatabase);
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            
            // Seleccionar una pregunta aleatoria del tema
            const questions = questionDatabase[randomTopic];
            const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
            
            // Actualizar el indicador de tema
            topicElement.textContent = `Tema: ${randomTopic}`;
            
            return randomQuestion;
        }

        // Función para barajar un array (algoritmo Fisher-Yates)
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // Función para mostrar una pregunta
        function displayQuestion(question) {
            // Mostrar la pregunta
            questionElement.textContent = question.question;
            
            // Limpiar opciones anteriores
            optionsElement.innerHTML = '';
            
            // Crear un array con las opciones y sus índices originales
            const optionsWithIndices = question.options.map((option, index) => ({
                text: option,
                originalIndex: index
            }));
            
            // Barajar las opciones
            const shuffledOptions = shuffleArray(optionsWithIndices);
            
            // Guardar el nuevo índice de la respuesta correcta
            currentQuestion.shuffledCorrectIndex = shuffledOptions.findIndex(
                option => option.originalIndex === question.correctAnswer
            );
            
            // Mostrar opciones barajadas
            shuffledOptions.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.textContent = `${String.fromCharCode(65 + index)}. ${option.text}`;
                optionElement.dataset.index = index;
                
                optionElement.addEventListener('click', () => selectOption(optionElement, index));
                
                optionsElement.appendChild(optionElement);
            });
            
            // Resetear estado
            selectedOption = null;
            answered = false;
            feedbackElement.style.display = 'none';
        }

        // Función para seleccionar una opción
        function selectOption(optionElement, index) {
            // Si ya se respondió, no hacer nada
            if (answered) return;
            
            // Quitar selección anterior
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            
            // Seleccionar nueva opción
            optionElement.classList.add('selected');
            selectedOption = index;
            
            // Verificar respuesta
            checkAnswer();
        }

        // Función para verificar la respuesta
        function checkAnswer() {
            if (selectedOption === null || answered) return;
            
            answered = true;
            const options = document.querySelectorAll('.option');
            const correctIndex = currentQuestion.shuffledCorrectIndex;
            
            // Marcar respuesta correcta e incorrecta
            options[correctIndex].classList.add('correct');
            
            if (selectedOption !== correctIndex) {
                options[selectedOption].classList.add('incorrect');
                feedbackElement.textContent = '¡Incorrecto! La respuesta correcta es: ' + 
                    `${String.fromCharCode(65 + correctIndex)}. ${options[correctIndex].textContent.substring(3)}`;
                feedbackElement.className = 'feedback incorrect-feedback';
            } else {
                score++;
                scoreElement.textContent = score;
                feedbackElement.textContent = '¡Correcto!';
                feedbackElement.className = 'feedback correct-feedback';
            }
            
            feedbackElement.style.display = 'block';
        }

        // Función para cargar la siguiente pregunta
        function nextQuestion() {
            currentQuestion = getRandomQuestion();
            displayQuestion(currentQuestion);
        }

        // Event listener para el botón de siguiente
        nextButton.addEventListener('click', nextQuestion);

        // Iniciar el juego
        nextQuestion();
    </script>
</body>
</html>
